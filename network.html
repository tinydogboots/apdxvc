<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Signage & Wayfinding — Relationship Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/xfu3eep.css">

<link rel="stylesheet" href="network/styles/tokens.css">
<link rel="stylesheet" href="network/styles/base.css">
<link rel="stylesheet" href="network/styles/header.css">
<link rel="stylesheet" href="network/styles/canvas.css">
<link rel="stylesheet" href="network/styles/panel.css">
<link rel="stylesheet" href="network/styles/drawer.css">
<link rel="stylesheet" href="network/styles/styler.css">
<link rel="stylesheet" href="network/styles/listview.css">

<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<!-- terrain background — ISS image, no filter, fills viewport -->
<svg id="terrain-bg" xmlns="http://www.w3.org/2000/svg"
     style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0">
  <image href="data/bg_terrain.jpg" x="0" y="0" width="100%" height="100%"
         preserveAspectRatio="xMidYMid slice"/>
</svg>

<header>
  <h1>FORM 01 · RELATIONSHIP MAP</h1>

  <div class="view-toggle">
    <button class="view-btn active" data-view="pyramid">Pyramid</button>
    <button class="view-btn"        data-view="list">List</button>
  </div>

  <!-- desktop: search + chips inline -->
  <div class="header-controls">
    <div class="search"><input id="search-desktop" type="text" placeholder="search…"></div>
    <div class="filters" id="tier-filters-desktop">
      <span class="chip active" data-tier="foundational">Foundational</span>
      <span class="chip active" data-tier="intermediate">Intermediate</span>
      <span class="chip active" data-tier="advanced">Advanced</span>
    </div>
  </div>

  <!-- mobile: icon opens drawer -->
  <button class="filter-btn" id="open-drawer" aria-label="Filters">+</button>
</header>

<div class="main">
  <div id="canvas-wrap">
    <div id="loading">Loading data…</div>
    <svg id="canvas"></svg>
  </div>

  <!-- list view (alternative to canvas) -->
  <div id="list-wrap"></div>

  <!-- isolation bar -->
  <div id="isolation-bar">
    <span id="isolation-label">Isolated view</span>
    <button id="exit-isolation">Exit</button>
  </div>

  <!-- detail panel -->
  <div id="panel">
    <div class="panel-header">
      <div class="panel-dot" id="panel-dot"></div>
      <div class="panel-comment" id="panel-comment"></div>
      <button class="panel-isolate" id="panel-isolate" title="Isolate this node and its connections" style="display:none;">Isolate</button>
      <button class="panel-close" id="panel-close">×</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<!-- styler panel — designer texture controls (desktop only) -->
<button id="styler-toggle" title="Open styler (texture controls)">S</button>
<div id="styler-panel"></div>

<!-- mobile filter drawer -->
<div id="filter-drawer">
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer-sheet">
    <div class="drawer-handle"></div>
    <div class="drawer-search">
      <input id="search-mobile" type="text" placeholder="search…">
    </div>
    <div class="drawer-section-label">Tier</div>
    <div class="drawer-chips" id="tier-filters-mobile">
      <span class="chip active" data-tier="foundational">Foundational</span>
      <span class="chip active" data-tier="intermediate">Intermediate</span>
      <span class="chip active" data-tier="advanced">Advanced</span>
    </div>
  </div>
</div>

<script src="network/js/state.js"></script>
<script src="network/js/bgcanvas.js"></script>
<script src="network/js/graph.js"></script>
<script src="network/js/pyramid.js"></script>
<script src="network/js/panel.js"></script>
<script src="network/js/controls.js"></script>
<script src="network/js/listview.js"></script>
<script src="network/js/styler.js"></script>
</body>
</html>
